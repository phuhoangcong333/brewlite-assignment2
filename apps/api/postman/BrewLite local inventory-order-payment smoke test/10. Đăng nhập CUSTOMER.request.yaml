$kind: http-request
url: "{{baseUrl}}/auth/login"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "email": "{{customerEmail}}",
      "password": "{{customerPassword}}"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('CUSTOMER login succeeds', function () { pm.response.to.have.status(200); });
      if (pm.response.code === 200) pm.collectionVariables.set('customerToken', pm.response.json().access_token);
    language: text/javascript
order: 10000
