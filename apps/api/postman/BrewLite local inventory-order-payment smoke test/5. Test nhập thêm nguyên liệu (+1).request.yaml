$kind: http-request
url: "{{baseUrl}}/ingredients/{{inventoryTestIngredientId}}/restock"
method: PATCH
headers:
  Authorization: Bearer {{staffToken}}
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "amount": 1
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('restock succeeds', function () { pm.response.to.have.status(200); });
      if (pm.response.code === 200) {
        const body = pm.response.json();
        pm.test('restock increases stock by one', function () { pm.expect(body.stockQuantity).to.eql(Number(pm.collectionVariables.get('inventoryTestIngredientInitialStock')) + 1); });
      }
    language: text/javascript
order: 5000
