# BrewLite - chạy cả hệ thống bằng 1 lệnh: docker compose up --build
services:
  db:
    image: postgres:16
    container_name: brewlite-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: brewlite
      POSTGRES_PASSWORD: brewlite123
      POSTGRES_DB: brewlite
    ports:
      # Cổng 5433 trên máy local -> 5432 trong container (tránh đụng PostgreSQL local)
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U brewlite -d brewlite"]
      interval: 5s
      timeout: 5s
      retries: 12

  api:
    build: ./apps/api
    container_name: brewlite-backend
    restart: unless-stopped
    env_file:
      - ./apps/api/.env
    environment:
      # Nếu chạy local cùng container DB thì giữ "db:5432", còn nếu nối AWS RDS thì đổi link RDS vào đây
      DATABASE_URL: "postgresql://brewlite:brewlite123@db:5432/brewlite?schema=public"
      JWT_SECRET: brewlite-doi-chuoi-bi-mat-nay
      PORT: 3001
    ports:
      - "3001:3001"
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: ./apps/web
      args:
        NEXT_PUBLIC_API_URL: http://localhost:3001
        NEXT_PUBLIC_USE_MOCK: "false"
    container_name: brewlite-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  pgdata: