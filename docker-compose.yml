# BrewLite - chạy cả hệ thống bằng 1 lệnh: docker compose up --build
services:
  db:
    image: postgres:16
    container_name: brewlite-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-brewlite}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-brewlite123}
      POSTGRES_DB: ${POSTGRES_DB:-brewlite}
    ports:
      # Cổng 5433 trên máy local -> 5432 trong container (tránh đụng PostgreSQL local)
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-brewlite} -d ${POSTGRES_DB:-brewlite}"]
      interval: 5s
      timeout: 5s
      retries: 12

  api:
    build: ./apps/api
    container_name: brewlite-backend
    restart: unless-stopped
    env_file:
      - path: ./apps/api/.env
        required: false
    environment:
      # Ở local tự lấy link db:5432 bên phải; trên EC2 tự lấy DATABASE_URL từ file .env gốc
      DATABASE_URL: ${DATABASE_URL:-postgresql://brewlite:brewlite123@db:5432/brewlite?schema=public}
      JWT_SECRET: ${JWT_SECRET:-brewlite-doi-chuoi-bi-mat-nay}
      PORT: 3001
      STAFF_EMAIL: ${STAFF_EMAIL:-admin@gmail.com}
      STAFF_PASSWORD: ${STAFF_PASSWORD:-123456}
    command: sh -c "npx prisma migrate deploy && npm run db:seed && npm run start:prod"
    ports:
      - "3001:3001"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:3001/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 6

  web:
    build:
      context: ./apps/web
      args:
        # Ở local tự lấy localhost:3001; trên EC2 tự lấy IP 47.129.180.144:3001 từ file .env gốc
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:3001}
        NEXT_PUBLIC_USE_MOCK: "false"
    container_name: brewlite-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy

volumes:
  pgdata: