s-serif" font-size="12" font-weight="bold" text-anchor="middle" x="512" y="582">UC-TV6-05</text><text fill="#0F172A" font-family="DejaVu Sans, Arial, sans-serif" font-size="15" font-weight="bold" text-anchor="middle" x="512" y="604">Hủy đơn chưa thanh toán</text><ellipse cx="512" cy="737" fill="#EFF6FF" rx="155" ry="44" stroke="#2563EB" stroke-width="1.8" /><text fill="#1D4ED8" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" x="512" y="729">UC-TV6-06</text><text fill="#0F172A" font-family="DejaVu Sans, Arial, sans-serif" font-size="15" font-weight="bold" text-anchor="middle" x="512" y="751">Xem đơn cần xử lý</text><ellipse cx="512" cy="855" fill="#EFF6FF" rx="155" ry="44" stroke="#2563EB" stroke-width="1.8" /><text fill="#1D4ED8" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" x="512" y="847">UC-TV6-07</text><text fill="#0F172A" font-family="DejaVu Sans, Arial, sans-serif" font-size="15" font-weight="bold" text-anchor="middle" x="512" y="869">Cập nhật trạng thái</text><ellipse cx="901" cy="745" fill="#EFF6FF" rx="155" ry="44" stroke="#2563EB" stroke-width="1.8" /><text fill="#1D4ED8" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" x="901" y="737">UC-TV6-08</text><text fill="#0F172A" font-family="DejaVu Sans, Arial, sans-serif" font-size="15" font-weight="bold" text-anchor="middle" x="901" y="759">Kiểm tra thứ tự trạng thái</text><ellipse cx="901" cy="855" fill="#EFF6FF" rx="155" ry="44" stroke="#2563EB" stroke-width="1.8" /><text fill="#1D4ED8" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" x="901" y="847">UC-TV6-09</text><text fill="#0F172A" font-family="DejaVu Sans, Arial, sans-serif" font-size="15" font-weight="bold" text-anchor="middle" x="901" y="869">Kiểm tra quyền nhân viên</text><ellipse cx="1218" cy="855" fill="#EFF6FF" rx="155" ry="44" stroke="#2563EB" stroke-width="1.8" /><text fill="#1D4ED8" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" x="1218" y="847">UC-TV6-10</text><text fill="#0F172A" font-family="DejaVu Sans, Arial, sans-serif" font-size="15" font-weight="bold" text-anchor="middle" x="1218" y="869">Ghi nhận điểm thưởng</text><polyline fill="none" marker-end="url(#arrowHead)" points="650,452 757,386" stroke="#64748B" stroke-dasharray="7,5" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" /><text fill="#475569" font-family="DejaVu Sans, Arial, sans-serif" font-size="13" x="683" y="407">«include»</text><polyline fill="none" marker-end="url(#arrowHead)" points="652,842 759,775" stroke="#64748B" stroke-dasharray="7,5" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" /><text fill="#475569" font-family="DejaVu Sans, Arial, sans-serif" font-size="13" x="684" y="786">«include»</text><polyline fill="none" marker-end="url(#arrowHead)" points="666,855 746,855" stroke="#64748B" stroke-dasharray="7,5" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" /><text fill="#475569" font-family="DejaVu Sans, Arial, sans-serif" font-size="13" x="678" y="844">«include»</text><polyline fill="none" marker-end="url(#arrowHead)" points="1218,899 1218,945 512,945 512,900" stroke="#64748B" stroke-dasharray="7,5" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" /><text fill="#475569" font-family="DejaVu Sans, Arial, sans-serif" font-size="14" x="790" y="935">«extend»  [READY → COMPLETED]</text><rect fill="#F8FAFC" height="230" rx="12" stroke="#CBD5E1" width="264" x="1080" y="233" /><text fill="#0F172A" font-family="DejaVu Sans, Arial, sans-serif" font-size="14" font-weight="bold" x="1097" y="260">GHI CHÚ NGHIỆP VỤ</text><text fill="#334155" font-family="DejaVu Sans, Arial, sans-serif" font-size="13" font-weight="normal" x="1097" y="294">• Theo dõi: tự làm mới ~8 giây</text><text fill="#334155" font-family="DejaVu Sans, Arial, sans-serif" font-size="13" font-weight="normal" x="1097" y="328">• Đơn của người khác: 404</text><text fill="#334155" font-family="DejaVu Sans, Arial, sans-serif" font-size="13" font-weight="normal" x="1097" y="362">• Không đủ quyền: 403</text><text fill="#334155" font-family="DejaVu Sans, Arial, sans-serif" font-size="13" font-weight="normal" x="1097" y="396">• Sai thứ tự: 409</text><text fill="#334155" font-family="DejaVu Sans, Arial, sans-serif" font-size="13" font-weight="normal" x="1097" y="430">• Đã hủy: không xử lý tiếp</text><rect fill="#F0FDF4" height="85" rx="11" stroke="#86EFAC" width="272" x="1072" y="655" /><text fill="#166534" font-family="DejaVu Sans, Arial, sans-serif" font-size="14" font-weight="bold" x="1088" y="682">Điểm thưởng</text><text fill="#166534" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" x="1088" y="708">Chỉ ghi một lần khi hoàn thành</text><text fill="#475569" font-family="DejaVu Sans, Arial, sans-serif" font-size="15" x="68" y="1020">Quan hệ: đường liền = actor thực hiện; «include» = luôn thực hiện; «extend» = chỉ khi đủ điều kiện.</text><text fill="#64748B" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" x="68" y="1047">Nguồn: Assignment 2 + bảng phân công TV6; các UC hỗ trợ được bổ sung từ bản TV6 đã chuẩn bị.</text></svg>