$kind: http-request
url: "{{baseUrl}}/payments"
method: POST
headers:
  Content-Type: application/json
  Idempotency-Key: tv5-wrong-amount-{{$timestamp}}
body:
  type: json
  content: |-
    {
      "orderId": {{orderId2}},
      "amount": 999999,
      "method": "WALLET",
      "walletId": "WALLET-1234"
    }
auth:
  type: bearer
  credentials:
    token: "{{access_token}}"
scripts:
  - type: afterResponse
    code: pm.test("HTTP 400", () => pm.response.to.have.status(400));
    language: text/javascript
order: 6000
