name: BrewLite CI Pipeline

on:
  push:
    branches: [ dev, main ]
  pull_request:
    branches: [ dev, main ]

jobs:
  lint-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository code
        uses: actions/checkout@v4

      - name: Set up Node.js environment
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Check Backend Build (NestJS)
        run: |
          if [ -d "backend" ]; then
            cd backend && npm ci && npm run build
          elif [ -d "apps/api" ]; then
            cd apps/api && npm ci && npm run build
          fi

      - name: Check Frontend Build (Next.js)
        run: |
          if [ -d "frontend" ]; then
            cd frontend && npm ci && npm run build
          elif [ -d "apps/web" ]; then
            cd apps/web && npm ci && npm run build
          fi