name: BrewLite CI Pipeline

on:
  push:
    branches: [ dev, main ]
  pull_request:
    branches: [ dev, main ]

jobs:
  ci-quality-gate:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: brewlite
          POSTGRES_PASSWORD: brewlite_test_password
          POSTGRES_DB: brewlite_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U brewlite -d brewlite_test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout repository code
        uses: actions/checkout@v4

      - name: Set up Node.js environment
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: 1. Install Dependencies (API & Web)
        run: |
          cd apps/api && npm install --legacy-peer-deps && npx prisma generate
          cd ../web && npm install --legacy-peer-deps

      - name: 2. Lint (API & Web)
        run: |
          cd apps/api && npm run lint --if-present
          cd ../web && npm run lint --if-present

      - name: 3. Unit & Integration Test (API & Web)
        env:
          DATABASE_URL: postgresql://brewlite:brewlite_test_password@localhost:5432/brewlite_test?schema=public
          JWT_SECRET: ci-test-jwt-secret-key-123456
        run: |
          cd apps/api
          npx prisma migrate deploy
          npm test
          cd ../web
          npm test

      - name: 4. Build (API & Web)
        run: |
          cd apps/api && npm run build --if-present
          cd ../web && npm run build --if-present