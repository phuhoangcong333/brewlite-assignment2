services:
  api:
    image: ${API_IMAGE}
    container_name: brewlite-backend
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL}
      JWT_SECRET: ${JWT_SECRET}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3000}
      PORT: 3001
      STAFF_EMAIL: ${STAFF_EMAIL:-admin@gmail.com}
      STAFF_PASSWORD: ${STAFF_PASSWORD:-123456}
    command: sh -c "npx prisma migrate deploy && npm run start:prod"
    ports:
      - "3001:3001"
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:3001/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 6

  web:
    image: ${WEB_IMAGE}
    container_name: brewlite-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy